name: Platform Sync Check

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  sync-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install tokscale + ccusage
        run: |
          npm install -g tokscale ccusage
      - name: Run platform sync check
        id: sync
        shell: bash
        run: |
          set +e
          node scripts/sync-platforms.mjs --json > sync-report.json
          result=$?
          set -e
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          cat sync-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-sync-report
          path: sync-report.json
          if-no-files-found: error
      - name: Create issue if confirmed gaps found
        if: steps.sync.outputs.exit_code == '1'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('sync-report.json', 'utf8'));
            if (report.discoveryFailed || report.upstream?.tokscale?.error || report.upstream?.ccusage?.error) {
              core.setFailed('Cannot open a gap issue when upstream discovery failed');
              return;
            }
            const tsGaps = report.gaps?.tokscale?.clientsNotInMap || [];
            const tsAdapterGaps = report.gaps?.tokscale?.clientsWithMissingAdapter || [];
            const ccGaps = report.gaps?.ccusage?.clientsNotInAdapters || [];
            const body = [
              '## Platform Sync Gaps Detected',
              '',
              `**Date:** ${report.timestamp}`,
              '',
              '### Tokscale',
              `- Clients not in map: ${tsGaps.length ? tsGaps.join(', ') : 'none'}`,
              `- Clients with missing adapter: ${tsAdapterGaps.length ? tsAdapterGaps.join(', ') : 'none'}`,
              `- Upstream clients: ${report.upstream.tokscale.clients.length}`,
              '',
              '### Ccusage',
              `- Clients not in adapters: ${ccGaps.length ? ccGaps.join(', ') : 'none'}`,
              `- Upstream clients: ${report.upstream.ccusage.clients.length}`,
              '',
              '### Action needed',
              'Run `node scripts/sync-platforms.mjs` locally to review; update `lib/constants.mjs` for unmapped clients or the adapter registry for missing adapters.',
              '',
              'Run: `node scripts/sync-platforms.mjs`'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Platform sync: gaps detected between upstream and our adapters',
              body,
              labels: ['maintenance', 'platform-sync']
            });
      - name: Fail check on gaps or upstream errors
        if: always() && steps.sync.outputs.exit_code != '0'
        env:
          SYNC_EXIT_CODE: ${{ steps.sync.outputs.exit_code }}
        run: |
          echo "Platform sync did not pass (exit code: ${SYNC_EXIT_CODE:-not-run})."
          exit 1
