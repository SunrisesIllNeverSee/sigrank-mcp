name: Publish to npm + MCP Registry

# Auto-publish flow: runs ONLY after CI (ci.yml) completes successfully on
# main. Bumps the patch version, publishes to npm, publishes to the MCP
# Registry, pushes the version commit back to main, and the app auto-syncs
# its MCP_VERSION constant (→ Vercel auto-deploys).
#
# npm publishing uses OIDC trusted publishing (no NPM_TOKEN needed).
# The trusted publisher is configured on npmjs.com for:
#   org: SunrisesIllNeverSee, repo: sigrank-mcp, workflow: publish.yml
#
# MCP Registry authentication uses GitHub OIDC (no secret needed for
# io.github.SunrisesIllNeverSee/* namespace). Requires id-token: write.
#
# SECURITY: This workflow is triggered by workflow_run (CI completion), NOT
# by push. This ensures publishing can never outrun CI — the publish job
# only fires after all CI checks pass. The bot's own version-commit push
# triggers CI but not publish (guarded by actor check), preventing an
# infinite loop.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to push the version bump branch
  pull-requests: write # needed to create + merge the version bump PR
  id-token: write # needed for mcp-publisher github-oidc authentication

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Bump + publish + sync app
    runs-on: ubuntu-latest
    # Only publish when CI succeeded. Skip if the CI run was triggered by
    # the bot's own version commit (prevents infinite loop). Allow manual
    # workflow_dispatch triggers.
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.actor != 'github-actions[bot]') ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history + token so we can push the version commit back
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # For workflow_run, checkout the SHA that CI ran against.
          ref: ${{ github.event.workflow_run.head_sha || '' }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # ── Pre-publish tests (mirror ci.yml test job) ──
      - name: Unit tests
        run: node test.mjs

      - name: Signing tests
        run: node __tests__/sign.test.mjs

      - name: TUI startup input regression
        run: node --test __tests__/tui-input.test.mjs

      - name: Version format check
        run: node scripts/check-version.mjs

      - name: Install and exercise the packed artifact
        run: npm run test:packaged

      # ── Bump patch version (in working tree, not committed yet) ──
      - name: Bump patch version
        id: bump
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "old_version=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${OLD_VERSION} → ${NEW_VERSION}"

      # ── Publish to npm FIRST (before git commit, so a failed publish
      #    doesn't leave a version bump in git that npm doesn't have) ──
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      # ── Commit the version bump + push (only runs if publish succeeded) ──
      # Rebases on latest main before pushing to avoid non-fast-forward rejection
      # when a concurrent push lands between checkout and this step. Without this,
      # the version commit is lost and package.json falls behind npm — which breaks
      # the app's cross-repo contract test (mcp-version-drift.test.mjs).
      - name: Sync server.json + manifest.json to new version
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          # Update server.json (MCP registry manifest)
          if [ -f server.json ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/g" server.json
          fi
          # Update manifest.json (MCPB manifest)
          if [ -f manifest.json ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/g" manifest.json
          fi
          echo "✓ Synced server.json + manifest.json to $NEW_VERSION"

      # ── Push version bump via PR (main is protected, can't push directly) ──
      - name: Push version bump via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          BRANCH="bot/version-${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json server.json manifest.json
          git commit -m "$NEW_VERSION"
          git push origin "$BRANCH"
          # Create PR and auto-merge (checks pass since it's just a version bump)
          PR_URL=$(gh pr create --title "$NEW_VERSION" --body "Auto-generated version bump from publish workflow." --head "$BRANCH" --base main)
          echo "Created PR: $PR_URL"
          # Wait for checks to pass, then merge
          sleep 5
          gh pr merge --squash --delete-branch --admin "$PR_URL" || {
            echo "⚠ Auto-merge failed, retrying in 30s..."
            sleep 30
            gh pr merge --squash --delete-branch --admin "$PR_URL" || {
              echo "✗ Auto-merge failed after retry"
              echo "  npm has $NEW_VERSION but package.json on main is stale."
              echo "  Manually merge the PR: $PR_URL"
              # Don't fail the workflow — npm publish already succeeded
            }
          }
          echo "✓ Version bump PR merged"

      # ── Publish to MCP Registry (non-blocking — npm propagation delay
      #    can cause this to fail, but the version commit is already pushed) ──
      # Uses GitHub OIDC authentication — no secret needed for io.github.* namespace.
      # The server.json name (io.github.SunrisesIllNeverSee/sigrank-mcp) must match
      # the mcpName in package.json and the GitHub repo owner.
      - name: Install mcp-publisher (pinned v1.8.1 + checksum verified)
        run: |
          MCP_PUBLISHER_VERSION="v1.8.1"
          MCP_PUBLISHER_SHA256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          MCP_PUBLISHER_URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          curl -L "$MCP_PUBLISHER_URL" -o /tmp/mcp-publisher.tar.gz
          echo "$MCP_PUBLISHER_SHA256  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf /tmp/mcp-publisher.tar.gz -C . mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Publish to MCP Registry
        continue-on-error: true
        run: ./mcp-publisher publish server.json

      # Version sync: sigrank-app checks npm daily at 07:00 UTC and auto-updates
      # its MCP_VERSION constant. No dispatch needed — the app pulls, we don't push.
