name: Publish to npm + MCP Registry

# EXPLICIT RELEASE ONLY. This workflow never runs on push-to-main or on CI
# completion. A release happens only when:
#
#   1. Manual dispatch (Actions → "Publish to npm + MCP Registry" → Run
#      workflow). `dry_run` defaults to true: the first run validates the
#      entire pipeline (tests, version bump, tarball) without releasing.
#      Re-run with dry_run=false to actually publish the next patch.
#   2. A version tag `v1.0.x` is pushed. The tag IS the release decision —
#      it publishes for real, and the tag's version becomes the package
#      version (must satisfy the 1.0.x patch-only scheme).
#
# npm auth: OIDC trusted publishing — NO NPM_TOKEN. npm CLI >= 11.5.1 is
# required for trusted publishing, so it is pinned below. The trusted
# publisher must be configured on npmjs.com for:
#   org: SunrisesIllNeverSee, repo: sigrank-mcp, workflow: publish.yml
# (npm-side setting; GitHub cannot verify it — if publish fails with
# E404/E401, check that configuration first.)
#
# MCP Registry authentication uses GitHub OIDC (id-token: write) — no secret
# needed for the io.github.SunrisesIllNeverSee/* namespace.
#
# HISTORY: this workflow previously fired via workflow_run after every
# successful CI run on main, so CI/docs-only merges attempted releases
# (run 37224071549 failed with npm E404; nothing was published). It also
# claimed OIDC in comments while passing NODE_AUTH_TOKEN from secrets —
# a dead/mismatched token overrides OIDC. Both defects fixed here.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — run tests + pack + npm --dry-run, skip npm/registry release"
        required: true
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: read # default; write granted only on the publish job

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Bump + publish + sync app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: write # needed to push the version bump branch
      pull-requests: write # needed to create + merge the version bump PR
      id-token: write # needed for npm OIDC trusted publishing + mcp-publisher github-oidc
    env:
      # Releases are real publishes only when a tag fired this run, or a
      # manual dispatch explicitly set dry_run=false.
      REAL_PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          # Full history + token so we can push the version commit back
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22's bundled
      # npm is older. Pinned exactly — no floating tags in the release path.
      - name: Pin npm CLI for trusted publishing
        run: npm install -g npm@11.5.1

      - run: npm ci --ignore-scripts

      # ── Pre-publish tests (mirror ci.yml test job) ──
      - name: Unit tests
        run: node test.mjs

      - name: Signing tests
        run: node __tests__/sign.test.mjs

      - name: TUI startup input regression
        run: node --test __tests__/tui-input.test.mjs

      - name: Version format check
        run: node scripts/check-version.mjs

      - name: Install and exercise the packed artifact
        run: npm run test:packaged

      # ── Resolve release version ──
      # Tag push: tag pins the version (must be v1.0.x). Dispatch: bump patch.
      - name: Resolve release version
        id: bump
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$TAG_VERSION" =~ ^1\.0\.[0-9]+$ ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} is not a v1.0.x release tag (patch-only scheme)"
              exit 1
            fi
            npm version "$TAG_VERSION" --no-git-tag-version
          else
            npm version patch --no-git-tag-version
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "old_version=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${OLD_VERSION} → ${NEW_VERSION}"
          if npm view "sigrank@${NEW_VERSION}" version >/dev/null 2>&1; then
            echo "::error::sigrank@${NEW_VERSION} already exists on npm — aborting"
            exit 1
          fi

      # ── Validate the exact tarball npm would publish ──
      - name: Validate package (npm publish --dry-run)
        run: npm publish --dry-run

      # ── Publish to npm FIRST (before git commit, so a failed publish
      #    doesn't leave a version bump in git that npm doesn't have) ──
      # No NODE_AUTH_TOKEN: authentication is OIDC trusted publishing via
      # id-token. --provenance attaches the supply-chain attestation.
      - name: Publish to npm (OIDC trusted publishing)
        if: env.REAL_PUBLISH == 'true'
        run: npm publish --provenance

      # ── Commit the version bump + push (only runs on a real publish) ──
      # Rebases on latest main before pushing to avoid non-fast-forward rejection
      # when a concurrent push lands between checkout and this step. Without this,
      # the version commit is lost and package.json falls behind npm — which breaks
      # the app's cross-repo contract test (mcp-version-drift.test.mjs).
      - name: Sync server.json + manifest.json to new version
        if: env.REAL_PUBLISH == 'true'
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          # Update server.json (MCP registry manifest)
          if [ -f server.json ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/g" server.json
          fi
          # Update manifest.json (MCPB manifest)
          if [ -f manifest.json ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/g" manifest.json
          fi
          echo "✓ Synced server.json + manifest.json to $NEW_VERSION"

      # ── Push version bump via PR (main is protected, can't push directly) ──
      - name: Push version bump via PR
        if: env.REAL_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          BRANCH="bot/version-${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Configure git auth since checkout used persist-credentials: false
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -b "$BRANCH"
          git add -A -- package.json server.json manifest.json
          git commit -m "$NEW_VERSION"
          git push origin "$BRANCH"
          # Create PR and auto-merge (checks pass since it's just a version bump)
          PR_URL=$(gh pr create --title "$NEW_VERSION" --body "Auto-generated version bump from publish workflow." --head "$BRANCH" --base main)
          echo "Created PR: $PR_URL"
          # Wait for checks to pass, then merge
          sleep 5
          gh pr merge --squash --delete-branch --admin "$PR_URL" || {
            echo "⚠ Auto-merge failed, retrying in 30s..."
            sleep 30
            gh pr merge --squash --delete-branch --admin "$PR_URL" || {
              echo "✗ Auto-merge failed after retry"
              echo "  npm has $NEW_VERSION but package.json on main is stale."
              echo "  Manually merge the PR: $PR_URL"
              # Don't fail the workflow — npm publish already succeeded
            }
          }
          echo "✓ Version bump PR merged"

      # ── Publish to MCP Registry (non-blocking — npm propagation delay
      #    can cause this to fail, but the version commit is already pushed) ──
      # Uses GitHub OIDC authentication — no secret needed for io.github.* namespace.
      # The server.json name (io.github.SunrisesIllNeverSee/sigrank-mcp) must match
      # the mcpName in package.json and the GitHub repo owner.
      - name: Install mcp-publisher (pinned v1.8.1 + checksum verified)
        if: env.REAL_PUBLISH == 'true'
        run: |
          MCP_PUBLISHER_VERSION="v1.8.1"
          MCP_PUBLISHER_SHA256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          MCP_PUBLISHER_URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          curl -L "$MCP_PUBLISHER_URL" -o /tmp/mcp-publisher.tar.gz
          echo "$MCP_PUBLISHER_SHA256  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf /tmp/mcp-publisher.tar.gz -C . mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        if: env.REAL_PUBLISH == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json
        if: env.REAL_PUBLISH == 'true'
        run: ./mcp-publisher validate server.json

      - name: Publish to MCP Registry
        if: env.REAL_PUBLISH == 'true'
        continue-on-error: true
        run: ./mcp-publisher publish server.json

      - name: Dry-run summary
        if: env.REAL_PUBLISH != 'true'
        run: |
          echo "DRY RUN complete — nothing was published."
          echo "Version that WOULD release: ${{ steps.bump.outputs.new_version }}"
          echo "Re-run this workflow with dry_run=false, or push tag v${{ steps.bump.outputs.new_version }}, to publish."

      # Version sync: sigrank-app checks npm daily at 07:00 UTC and auto-updates
      # its MCP_VERSION constant. No dispatch needed — the app pulls, we don't push.
