name: Publish to npm + MCP Registry

# Auto-publish flow: when tests pass on push to main, bump the patch version,
# publish to npm, publish to the MCP Registry, push the version commit back to
# main, and the app auto-syncs its MCP_VERSION constant (→ Vercel auto-deploys).
#
# Requires secrets:
#   NPM_TOKEN         — npm publish token (automation token recommended)
#
# MCP Registry authentication uses GitHub OIDC (no secret needed for
# io.github.SunrisesIllNeverSee/* namespace). Requires id-token: write.
#
# The workflow waits for CI (ci.yml) to pass before publishing. If CI fails,
# no publish happens.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to push the version bump commit back to main
  id-token: write # needed for mcp-publisher github-oidc authentication

jobs:
  # Gate: only run publish if CI would pass. We skip the publish job if the
  # push was made by this workflow itself (to avoid an infinite loop).
  publish:
    name: Bump + publish + sync app
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + token so we can push the version commit back
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # ── Pre-publish tests (mirror ci.yml test job) ──
      - name: Unit tests
        run: node test.mjs

      - name: Signing tests
        run: node __tests__/sign.test.mjs

      - name: TUI startup input regression
        run: node --test __tests__/tui-input.test.mjs

      - name: Version format check
        run: node scripts/check-version.mjs

      - name: Pack check (no test fixtures / secrets leak)
        run: |
          set -e
          TARBALL=$(npm pack --dry-run 2>&1)
          echo "$TARBALL"
          if echo "$TARBALL" | grep -iE "test|fixture|\.env|canon_parity|\.key"; then
            echo "✗ FAIL: test fixture or sensitive file found in tarball"
            exit 1
          fi
          if ! echo "$TARBALL" | grep -q "connect.mjs"; then
            echo "✗ FAIL: connect.mjs missing from tarball"
            exit 1
          fi
          echo "✓ Tarball is clean"

      # ── Bump patch version (in working tree, not committed yet) ──
      - name: Bump patch version
        id: bump
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "old_version=${OLD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped ${OLD_VERSION} → ${NEW_VERSION}"

      # ── Publish to npm FIRST (before git commit, so a failed publish
      #    doesn't leave a version bump in git that npm doesn't have) ──
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      # ── Commit the version bump + push (only runs if publish succeeded) ──
      # Rebases on latest main before pushing to avoid non-fast-forward rejection
      # when a concurrent push lands between checkout and this step. Without this,
      # the version commit is lost and package.json falls behind npm — which breaks
      # the app's cross-repo contract test (mcp-version-drift.test.mjs).
      - name: Sync server.json + manifest.json to new version
        run: |
          NEW_VERSION="${{ steps.bump.outputs.new_version }}"
          # Update server.json (MCP registry manifest)
          if [ -f server.json ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/g" server.json
          fi
          # Update manifest.json (MCPB manifest)
          if [ -f manifest.json ]; then
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$NEW_VERSION\"/g" manifest.json
          fi
          echo "✓ Synced server.json + manifest.json to $NEW_VERSION"

      # ── Publish to MCP Registry (after server.json is synced to new version) ──
      # Uses GitHub OIDC authentication — no secret needed for io.github.* namespace.
      # The server.json name (io.github.SunrisesIllNeverSee/sigrank-mcp) must match
      # the mcpName in package.json and the GitHub repo owner.
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish server.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json server.json manifest.json
          git commit -m "${{ steps.bump.outputs.new_version }}"
          # Discard any unstaged changes from npm ci/build steps so rebase can proceed.
          git checkout -- . || true
          # Pull --rebase in case a concurrent push landed on main since checkout.
          # Retry up to 3 times to handle transient push races.
          for attempt in 1 2 3; do
            git pull --rebase origin main || { echo "✗ rebase failed on attempt $attempt"; exit 1; }
            if git push origin main; then
              echo "✓ Version commit pushed on attempt $attempt"
              break
            fi
            echo "⋯ Push rejected (attempt $attempt), rebaseing and retrying..."
            if [ "$attempt" -eq 3 ]; then
              echo "✗ Failed to push version commit after 3 attempts"
              echo "  npm has ${{ steps.bump.outputs.new_version }} but package.json on main is stale."
              echo "  Manually bump package.json to ${{ steps.bump.outputs.new_version }} and push."
              exit 1
            fi
          done

      # Version sync: sigrank-app checks npm daily at 07:00 UTC and auto-updates
      # its MCP_VERSION constant. No dispatch needed — the app pulls, we don't push.
