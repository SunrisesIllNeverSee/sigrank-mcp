name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Secret scan — blocks commits that leak keys/tokens. Uses gitleaks; for a
  # public repo the default GITHUB_TOKEN is sufficient (no license key needed).
  # Especially important here: this repo holds ed25519 key generation + signing
  # code (keystore.mjs, sign.mjs) — a leaked private key would allow forged
  # signed submissions to the leaderboard.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action needs pull-requests: write to post review comments on
      # PRs. Without it the scan still runs and fails on leaks, but PR
      # annotations silently don't appear.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan past commits, not just the diff.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .github/gitleaks.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: node test.mjs

      - name: Signing tests
        run: node __tests__/sign.test.mjs

      - name: TUI startup input regression
        run: node --test __tests__/tui-input.test.mjs

      - name: Version format check (3-digit ruleset)
        run: node scripts/check-version.mjs

      # Intra-repo contract tests (no cross-repo checkout needed)
      - name: Intra-repo constants contract (adapter registry ↔ submit enum ↔ tokscale map)
        run: node --test __tests__/contract/constants-contract.test.mjs

      - name: Intra-repo leaderboard-metric contract (no inline yield_ literals)
        run: node --test __tests__/contract/leaderboard-metric-contract.test.mjs

  # Cross-repo contract tests — catch drift between the MCP server and the web
  # app. The codex landing was triple-blocked because platform enums drifted.
  # This job checks out the web repo and runs all cross-repo contract tests.
  cross-repo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Checkout sigrank-app (the other half of the contract)
        uses: actions/checkout@v7
        with:
          repository: SunrisesIllNeverSee/sigrank-app
          path: _sigrank-app
          # Public repo — no token needed. If it goes private, add a PAT secret.
          # token: ${{ secrets.CROSS_REPO_PAT }}

      - name: Cross-repo platform-enum contract test
        run: node __tests__/contract/platform-enum-contract.test.mjs ${{ github.workspace }}/_sigrank-app

      - name: Cross-repo class-tier contract test
        run: node __tests__/contract/class-tier-contract.test.mjs ${{ github.workspace }}/_sigrank-app

      - name: Cross-repo leaderboard-metric contract test
        run: node __tests__/contract/leaderboard-metric-contract.test.mjs ${{ github.workspace }}/_sigrank-app

      # Standalone Standard conformance gate — validates the MCP producer
      # against the authoritative fixture pack from sigrank-standard. The
      # Standard ref is pinned via SIGRANK_STANDARD_REF so upstream changes
      # cannot silently alter consumer builds.
      - name: Checkout sigrank-standard (authoritative fixture pack)
        uses: actions/checkout@v7
        with:
          repository: SunrisesIllNeverSee/sigrank-standard
          path: _sigrank-standard
          ref: ${{ vars.SIGRANK_STANDARD_REF || '224505a' }}

      - name: Standalone Standard conformance gate
        env:
          SIGRANK_STANDARD_REF: ${{ vars.SIGRANK_STANDARD_REF || '224505a' }}
        run: node __tests__/contract/standalone-conformance.test.mjs ${{ github.workspace }}/_sigrank-standard

  # Verify the published tarball doesn't leak test fixtures or sensitive files.
  # The files[] whitelist in package.json controls what ships; this job is
  # defense-in-depth in case the whitelist is ever accidentally widened.
  pack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci

      - name: Install and exercise the packed artifact
        run: npm run test:packaged
