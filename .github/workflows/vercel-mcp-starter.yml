name: Vercel MCP Starter

on:
  pull_request:
    paths:
      - "examples/vercel-remote-mcp/**"
      - ".github/workflows/vercel-mcp-starter.yml"
  push:
    branches: [main]
    paths:
      - "examples/vercel-remote-mcp/**"
      - ".github/workflows/vercel-mcp-starter.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/vercel-remote-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
